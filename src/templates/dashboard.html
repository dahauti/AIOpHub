{% extends "base.html" %}
{% from "partials/macros.html" import spinner %}
{% block content %}
<header class="mb-8 flex flex-wrap items-end justify-between gap-4">
  <div>
    <p class="label">AIOpHub Sync Engine</p>
    <h1 class="mt-1 text-2xl font-semibold tracking-tight text-slate-50">BC &rarr; Frontu vehicle sync</h1>
  </div>
</header>
<section id="batch-sync" aria-labelledby="batch-heading" class="mb-10">
  {% include "partials/status.html" %}
</section>
<section id="single-vehicle" aria-labelledby="single-heading" class="card">
  <h2 id="single-heading" class="label">Single-vehicle canary</h2>
  <form hx-post="/api/sync/vehicle" hx-target="#single-debug" hx-swap="morph" hx-disabled-elt="find button" class="mt-3 flex flex-wrap items-center gap-2">
    <input type="text" name="serial_no" placeholder="SerialNo" aria-label="Vehicle SerialNo" required maxlength="128" class="field w-64 font-mono">
    <input type="hidden" name="force_live" value="true">
    <button type="submit" class="btn-ghost">{{ spinner() }}Sync Vehicle (Live Single)</button>
  </form>
  <div id="single-debug"></div>
</section>
{% endblock %}
